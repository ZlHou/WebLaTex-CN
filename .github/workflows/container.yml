name: Build, test and publish WebLaTeX CN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/zlhou/weblatex-cn" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and compile smoke documents
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          load: true
          tags: weblatex-cn:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image repository source
        run: |
          test "$(docker image inspect weblatex-cn:test --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/ZlHou/WebLaTex-CN"
      - name: Verify runtime as non-root
        run: |
          docker run --rm weblatex-cn:test bash -ec '
            test "$(id -u)" -ne 0
            test -w "$NPM_CONFIG_PREFIX"
            codex --version
            check-latex-environment
          '
      - name: Compile example with both engines
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/example.tex,dst=/tmp/example.tex,readonly" \
            weblatex-cn:test bash -ec '
              cd /tmp
              for engine in xelatex lualatex; do
                latexmk "-$engine" -interaction=nonstopmode -halt-on-error -outdir="/tmp/$engine" example.tex
                test -s "/tmp/$engine/example.pdf"
              done
            '
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag weblatex-cn:test "$IMAGE:latest"
          docker tag weblatex-cn:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
